  <title>Comparing models without hiding their mistakes</title>
  <rect width="1120" height="740" fill="#f8faf5" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#85947c" />
    </marker>
  </defs>
  <text font-family="Arial, sans-serif" font-size="24" text-anchor="start" font-weight="bold" x="35" y="47" fill="#294837">Comparing models without hiding their mistakes</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" x="35" y="77" fill="#6c7f60">Exploratory smoke tests; expert quality labels and a building-specific holdout set are still needed.</text>
  <path stroke-width="1.5" marker-end="url(#arrow)" d="M195.0 225 L525.0 340" fill="none" stroke="#85947c" />
  <rect x="320.8" y="263.5" width="78.4" height="18" fill="#f8faf5" />
  <text font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" x="360.0" y="275.5" fill="#6c7f60">same inputs</text>
  <path stroke-width="1.5" marker-end="url(#arrow)" d="M800.0 225 L525.0 340" fill="none" stroke="#85947c" />
  <rect x="604.1" y="263.5" width="116.80000000000001" height="18" fill="#f8faf5" />
  <text font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" x="662.5" y="275.5" fill="#6c7f60">record conditions</text>
  <path stroke-width="1.5" marker-end="url(#arrow)" d="M525.0 440 L230.0 565" fill="none" stroke="#85947c" />
  <rect x="315.9" y="483.5" width="123.2" height="18" fill="#f8faf5" />
  <text font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" x="377.5" y="495.5" fill="#6c7f60">success or failure</text>
  <path stroke-width="1.5" marker-end="url(#arrow)" d="M400 617.5 L660 617.5" fill="none" stroke="#85947c" />
  <rect x="478.0" y="598.5" width="104.0" height="18" fill="#f8faf5" />
  <text font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" x="530.0" y="610.5" fill="#6c7f60">inspect results</text>
  <rect x="50" y="130" width="290" height="95" rx="8" fill="#eaf0f3" stroke="#526c7a" />
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" x="195.0" y="163.5" fill="#294837">Fixed images + fixed prompt</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="195.0" y="181.5" fill="#294837">Two road photos + two synthetic</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="195.0" y="199.5" fill="#294837">controls</text>
  <rect x="650" y="130" width="300" height="95" rx="8" fill="#eaf0f3" stroke="#526c7a" />
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" x="800.0" y="163.5" fill="#294837">Select available Local / VPS models</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="800.0" y="181.5" fill="#294837">Pin revisions · seed 42</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="800.0" y="199.5" fill="#294837">140 tokens · record execution settings</text>
  <rect x="350" y="340" width="350" height="100" rx="8" fill="#eaf2e3" stroke="#517248" />
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" x="525.0" y="376.0" fill="#294837">For each model × image × repetition</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="525.0" y="394.0" fill="#294837">Local worker or VPS request</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="525.0" y="412.0" fill="#294837">VPS can retain a warm model</text>
  <rect x="60" y="565" width="340" height="105" rx="8" fill="#eaf2e3" stroke="#517248" />
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" x="230.0" y="603.5" fill="#294837">Save each row immediately</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="230.0" y="621.5" fill="#294837">Image SHA-256 · prompt · raw text</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="230.0" y="639.5" fill="#294837">Time · tokens · peak worker RAM</text>
  <rect x="660" y="565" width="340" height="105" rx="8" fill="#ffffff" stroke="#7e8975" />
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" x="830.0" y="603.5" fill="#294837">Compare observations and latency</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="830.0" y="621.5" fill="#294837">Human rubric review follows</text>
  <text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" x="830.0" y="639.5" fill="#294837">Do not label speed as accuracy</text>
  <text font-family="Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" x="35" y="719" fill="#87947b">Imarah.tech · Phase 1 · September 2026 · Edit the paired .drawio file in diagrams.net</text>
</svg>